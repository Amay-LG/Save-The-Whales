<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#e4f5f9;background:transparent}.ocean{position:relative;border-radius:14px;overflow:hidden;background:linear-gradient(#64b7c8 0%,#217f99 10%,#09546f 40%,#07324c 100%);border:1px solid #6cc8d344}.ocean:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 10% 0%,#e2ffff22,transparent 50%);pointer-events:none}svg{display:block;width:100%;height:265px}.bar{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;background:#052b40b8;gap:10px}h2{font-size:18px;font-weight:550;margin:0 0 4px;letter-spacing:-.4px}p{font-size:12px;color:#b5dce8;margin:0;line-height:1.6}button{font:600 12px system-ui;border:1px solid #bdefff88;border-radius:20px;padding:9px 14px;color:#daf7ff;background:#092f44;cursor:pointer}button.active{background:#b5f0dc;color:#07394a;border-color:#b5f0dc}.buttons{display:flex;gap:6px;white-space:nowrap}.note{padding:9px 4px 0;font-size:10px;color:#93b7c5;line-height:1.5}.bubble{animation:rise 8s linear infinite}@keyframes rise{from{transform:translateY(20px);opacity:0}30%{opacity:.5}to{transform:translateY(-100px);opacity:0}}@media(max-width:650px){.bar{flex-direction:column;align-items:start;padding:13px 15px}svg{height:220px}h2{font-size:17px}}@media(prefers-reduced-motion:reduce){.bubble{animation:none}}
</style></head><body><section class="ocean" aria-label="Illustration of a ship course changing around a whale sighting">
<svg viewBox="0 0 800 280" role="img" aria-label="Illustrative route around a whale; not a model output">
<defs><linearGradient id="whale" x2="0" y2="1"><stop stop-color="#65b8cb"/><stop offset="1" stop-color="#216c89"/></linearGradient></defs>
<path d="M0 23Q100 8 200 23T400 23T600 23T800 23" fill="none" stroke="#d2ffff77" stroke-width="2"/>
<path d="M0 30Q100 15 200 30T400 30T600 30T800 30" fill="none" stroke="#d2ffff22"/>
<g fill="#a7e9f244"><circle class="bubble" cx="130" cy="220" r="2"/><circle class="bubble" style="animation-delay:2s" cx="550" cy="250" r="3"/><circle class="bubble" style="animation-delay:4s" cx="710" cy="200" r="2"/></g>
<path d="M35 145H765" stroke="#d4ecf655" stroke-dasharray="5 7" fill="none"/>
<path id="course" d="M35 145C210 145 230 50 380 55S570 145 765 145" stroke="#b9f7dc" stroke-width="2.5" fill="none"/>
<circle cx="410" cy="165" r="56" stroke="#c8efe733" fill="#c2ffff06" stroke-dasharray="3 7"/>
<g transform="translate(285 115) scale(.6)"><path d="M35 85C70 38 142 32 205 60C249 80 270 101 310 80C324 62 326 39 351 23C353 45 351 61 340 75C362 65 383 72 396 85C375 92 358 91 342 88C318 121 294 135 255 134C221 146 190 140 162 130C150 152 131 166 109 165C116 149 123 137 131 125C89 130 55 111 35 85Z" fill="url(#whale)" stroke="#92d5dd77" stroke-width="1.5"/><circle cx="62" cy="81" r="3" fill="#d7f4ee"/><path d="M44 91Q79 108 111 101" stroke="#b9edf03d" fill="none"/></g>
<text x="410" y="248" text-anchor="middle" fill="#cbecf4" font-size="11" letter-spacing="1.5">A LITTLE MORE ROOM TO PASS.</text>
<g id="ship"><path d="M-20-7H10L24 0L10 7H-20Z" fill="#e5faf9" stroke="#052a40"/><rect x="-13" y="-5" width="8" height="10" rx="1" fill="#2b6174"/><path d="M-27-5H-42M-27 0H-47M-27 5H-39" stroke="#d5ffef88" stroke-width="1.5"/></g>
<text x="36" y="180" fill="#b5d8e5" font-size="10">START</text><text x="765" y="180" text-anchor="end" fill="#b5d8e5" font-size="10">DESTINATION</text>
</svg><div class="bar"><div><h2 id="title">A small change of course.</h2><p id="description">A sighting can change the path. The tradeoff is time and distance.</p></div><div class="buttons"><button id="usual" aria-pressed="false">Usual route</button><button id="aware" class="active" aria-pressed="true">Whale-aware route</button><button id="pause" aria-label="Pause animation">Ⅱ</button></div></div></section>
<div class="note">Illustrative animation · not a prediction, navigation instruction, or measured outcome. Run the simulation below to compare modeled results.</div>
<script>
const course=document.getElementById('course'),ship=document.getElementById('ship');let active=true,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,t=0,last=0;
function choose(value){active=value;course.setAttribute('d',value?'M35 145C210 145 230 50 380 55S570 145 765 145':'M35 145H765');course.setAttribute('stroke',value?'#b9f7dc':'#d4ecf6');for(const[id,on]of[['aware',value],['usual',!value]]){document.getElementById(id).classList.toggle('active',on);document.getElementById(id).setAttribute('aria-pressed',String(on));}document.getElementById('title').textContent=value?'A small change of course.':'A shared stretch of ocean.';document.getElementById('description').textContent=value?'A sighting can change the path. The tradeoff is time and distance.':'Recorded ship routes can overlap places where whales are observed.';t=0;}
document.getElementById('usual').onclick=()=>choose(false);document.getElementById('aware').onclick=()=>choose(true);document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ';document.getElementById('pause').setAttribute('aria-label',paused?'Play animation':'Pause animation');};
function frame(now){const delta=last?Math.min(50,now-last):0;last=now;if(!paused)t=(t+delta/16000)%1;const length=course.getTotalLength(),p=course.getPointAtLength(t*length),q=course.getPointAtLength(Math.min(length,t*length+1));ship.setAttribute('transform',`translate(${p.x} ${p.y}) rotate(${Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI})`);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
